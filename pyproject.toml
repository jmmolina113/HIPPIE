[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hippie-xray"
version = "0.1.0.dev0"
description = "Reference-preserving Python port of the X-ray Pinhole Imaging Pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "h5py>=3.8",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[project.scripts]
hippie-datasets = "hippie.cli:datasets"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
