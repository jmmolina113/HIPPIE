name: Build and test HIPPIE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test tools
        run: python -m pip install -e . pytest
      - name: Run Python tests
        run: pytest -q
